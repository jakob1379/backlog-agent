</defs>
<style>
text{font-feature-settings:'ss01','cv11'}.in{animation:in .9s cubic-bezier(.2,.7,.2,1) backwards}@keyframes in{from{opacity:0;transform:translateY(8px)}}.tick{animation:tick .5s ease-out backwards}@keyframes tick{from{opacity:0}}.sweep{animation:spin 12s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.halo{transform-box:fill-box;transform-origin:center;opacity:0;animation:ping 12s linear infinite}@keyframes ping{0%{transform:scale(1);opacity:.85}22%{transform:scale(3.4);opacity:0}100%{transform:scale(3.4);opacity:0}}.c{fill:#52DBA8;animation:clean 12s linear infinite}.o{fill:#F7B955;animation:owner 12s linear infinite}@keyframes clean{0%,10%{fill:#8EA2FF}28%,100%{fill:#52DBA8}}@keyframes owner{0%,10%{fill:#8EA2FF}28%,100%{fill:#F7B955}}.breathe{animation:breathe 4s ease-in-out infinite}@keyframes breathe{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
